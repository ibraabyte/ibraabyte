<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity and stack</title>
  <desc id="desc">Five contributions in the last year, six private repositories, and a stack of Python, TypeScript, and JavaScript.</desc>
  <style>
    .bg { fill: oklch(0.08 0 0); }
    .rule { stroke: oklch(0.25 0 0); }
    .label { fill: oklch(0.65 0 0); font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
    .value { fill: oklch(0.95 0 0); font: 600 34px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .accent { fill: oklch(0.636 0.218 355.3); }
    .python { fill: oklch(0.72 0.13 235); }
    .typescript { fill: oklch(0.61 0.17 250); }
    .javascript { fill: oklch(0.86 0.17 94); }
    .stack { fill: oklch(0.92 0 0); font: 500 24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect class="bg" width="1200" height="420"/>

  <text class="label" x="78" y="74">ACTIVITY · LAST 12 MONTHS</text>
  <line class="rule" x1="78" y1="98" x2="1122" y2="98" stroke-width="2"/>

  <g transform="translate(78 136)">
    <circle class="accent" cx="9" cy="12" r="7"/>
    <text class="label" x="34" y="19">CONTRIBUTIONS</text>
    <text class="value" x="34" y="62">05</text>
  </g>

  <line class="rule" x1="400" y1="134" x2="400" y2="220" stroke-width="2"/>

  <g transform="translate(466 136)">
    <circle class="accent" cx="9" cy="12" r="7"/>
    <text class="label" x="34" y="19">PRIVATE REPOSITORIES</text>
    <text class="value" x="34" y="62">06</text>
  </g>

  <line class="rule" x1="826" y1="134" x2="826" y2="220" stroke-width="2"/>

  <g transform="translate(892 136)">
    <circle class="accent" cx="9" cy="12" r="7"/>
    <text class="label" x="34" y="19">LANGUAGES</text>
    <text class="value" x="34" y="62">03</text>
  </g>

  <line class="rule" x1="78" y1="254" x2="1122" y2="254" stroke-width="2"/>
  <text class="label" x="78" y="304">STACK</text>

  <g transform="translate(78 338)">
    <circle class="python" cx="12" cy="12" r="12"/>
    <text class="stack" x="38" y="21">Python</text>
  </g>
  <g transform="translate(394 338)">
    <circle class="typescript" cx="12" cy="12" r="12"/>
    <text class="stack" x="38" y="21">TypeScript</text>
  </g>
  <g transform="translate(774 338)">
    <circle class="javascript" cx="12" cy="12" r="12"/>
    <text class="stack" x="38" y="21">JavaScript</text>
  </g>
</svg>
